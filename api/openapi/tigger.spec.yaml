openapi: 3.0.3

info:
  title: tigger
  version: 1.0.0
  description: tigger API

paths:

  /:
    get:
      operationId: getChat
      summary: Get chat interface
      responses:
        '200':
          description: Chat HTML page
          content:
            text/html:
              schema:
                type: string

  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /ask:
    post:
      operationId: ask
      summary: Ask a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Question"
      responses:
        "200":
          description: Successful answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "400":
          description: Invalid request
        "500":
          description: Internal server error

components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok

    Question:
      type: object
      required:
        - kind
        - question
      properties:
        question:
          type: string
          description: Question to ask
        kind:
          type: string
          description: Algorithm

    Answer:
      type: object
      required:
        - answer
      properties:
        answer:
          type: string
          description: Answer to the question
